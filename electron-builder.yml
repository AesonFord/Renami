# Direct-download installers: macOS .dmg, Windows NSIS, Linux AppImage and .deb.
# File names have no version, so releases/latest/download/<name> always finds the newest.
# Shared settings (files, document types, privacy strings) are in electron-builder.common.yml.
extends: ./electron-builder.common.yml
appId: app.renami
productName: Renami
mac:
  target: dmg
  artifactName: "${productName}-mac-${arch}.${ext}"
  # v1 has no Developer ID signature and is not notarized. identity "-" signs it ad hoc,
  # so the app's seal is intact and macOS asks before opening it instead of calling it damaged.
  # Hardened runtime would reject Electron's own pre-signed frameworks under an ad-hoc signature.
  identity: "-"
  hardenedRuntime: false
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-win-${arch}-setup.${ext}"
  # Adds "Rename with Renami" to the Explorer context menu of folders (build/installer.nsh).
  include: build/installer.nsh
linux:
  target: [AppImage, deb]
  category: Utility
  # Not "renami": that name belongs to the npm command line (src/cli), which opens this app
  # for bare paths. The .deb links /usr/bin/renami-app.
  executableName: renami-app
  icon: build/renami-logo.png
  maintainer: Renami
  # ${arch} is x86_64 for AppImage and amd64 for deb: each format's own spelling.
  artifactName: "${productName}-linux-${arch}.${ext}"
  # Lets file managers offer the app for folders ("Open With").
  mimeTypes: [inode/directory]
deb:
  # electron-builder's defaults (app-builder-lib 26, FpmTarget) plus perl, which ExifTool needs on Linux.
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, perl]
