name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new CodeQL queries run against code that hasn't changed.
  schedule:
    - cron: '0 6 * * 1'
  # Run it by hand on main right after going public, so the first PR has an analysis to compare against.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning can't upload on a private repo on the free plan, so push and PR runs skip until
    # Renami is public. Schedule and manual events' payloads may not carry `repository`, so they're let through.
    if: github.event.repository.visibility == 'public' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflows themselves: script injection, risky triggers, broad tokens.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
