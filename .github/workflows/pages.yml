name: Pages

# Deploys site/ to https://aesonford.github.io/Renami/ when it changes on main.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# The deploy job asks for what it needs.
permissions: {}

# One deploy at a time; a newer push waits rather than cancelling one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages needs the repo to be public on the free plan. Until then, pushes skip instead of failing.
    if: github.event.repository.visibility == 'public' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
