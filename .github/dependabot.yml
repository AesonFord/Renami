version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Routine bumps wait until a release has been public for a week, so a hijacked release is
    # usually caught before it's proposed. Security updates skip the wait.
    cooldown:
      default-days: 7
    # Electron majors go EOL after three releases; the exact pin must keep moving.
    groups:
      electron:
        patterns:
          - electron
          - electron-*
          - "@electron/*"
    # electron-vite 5 only accepts vite 5-7, and @vitejs/plugin-react 6 needs vite 8. Hold both
    # majors until a stable electron-vite supports vite 8, then upgrade the three together.
    ignore:
      - dependency-name: vite
        versions: [">=8"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=6"]
  # Keeps the SHA pins in .github/workflows current. It bumps the SHA and its # vN comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
